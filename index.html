<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शिवशक्ति लहंगा हाउस</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-tab { border-bottom: 3px solid #e11d48; color: #e11d48; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-rose-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">शिवशक्ति लहंगा हाउस</h1>
                <p class="text-xs text-rose-200">किराया एवं बिक्री केंद्र | लहंगा • गाउन • ज्वेलरी</p>
            </div>
            <!-- Mode Switch Button -->
            <button onclick="toggleMode()" id="modeBtn" class="bg-white text-rose-700 text-xs px-3 py-1.5 rounded-full font-semibold shadow">
                <i class="fa-solid fa-book"></i> खाता / एडमिन
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto p-4">

        <!-- ================= CUSTOMER VIEW ================= -->
        <div id="customerView">
            
            <!-- Category Filter -->
            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none text-sm">
                <button onclick="filterCategory('All')" class="cat-btn px-4 py-1.5 rounded-full bg-rose-600 text-white font-medium shadow-sm">सभी</button>
                <button onclick="filterCategory('लहंगा')" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-700 border">लहंगा</button>
                <button onclick="filterCategory('गाउन')" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-700 border">गाउन</button>
                <button onclick="filterCategory('चुनरी')" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-700 border">चुनरी</button>
                <button onclick="filterCategory('ज्वेलरी')" class="cat-btn px-4 py-1.5 rounded-full bg-white text-gray-700 border">ज्वेलरी</button>
            </div>

            <!-- Date Checker Info -->
            <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg my-3 text-xs text-amber-800 flex items-center justify-between">
                <span><i class="fa-regular fa-calendar-check text-rose-600 mr-1"></i> किसी भी ड्रेस पर क्लिक करके उसकी खाली तारीखें और रेट देखें।</span>
            </div>

            <!-- Product Grid -->
            <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
                <!-- Products injected by JS -->
            </div>
        </div>

        <!-- ================= ADMIN / KHATA VIEW ================= -->
        <div id="adminView" class="hidden">
            <div class="bg-rose-50 border border-rose-200 p-3 rounded-lg mb-4 flex justify-between items-center">
                <h2 class="font-bold text-rose-800"><i class="fa-solid fa-lock"></i> दुकान का डिजिटल खाता</h2>
                <button onclick="openAddProductModal()" class="bg-rose-600 text-white text-xs px-3 py-1.5 rounded shadow">
                    + नया सामान जोड़ें
                </button>
            </div>

            <!-- Bookings Ledger List -->
            <h3 class="font-bold text-gray-700 mb-2 text-sm">हाल की बुकिंग और हिसाब:</h3>
            <div id="bookingLedger" class="space-y-3">
                <!-- Bookings injected by JS -->
            </div>
        </div>

    </main>

    <!-- ================= BOOKING MODAL (FOR CUSTOMER) ================= -->
    <div id="bookingModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modalTitle" class="font-bold text-lg text-rose-700"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-black text-xl">&times;</button>
            </div>

            <div class="my-3">
                <img id="modalImg" class="w-full h-48 object-cover rounded-lg mb-2" src="" alt="">
                <div class="flex justify-between text-sm bg-gray-50 p-2 rounded">
                    <div>किराया: <b id="modalRent" class="text-rose-600"></b></div>
                    <div>सेल कीमत: <b id="modalSale" class="text-green-600"></b></div>
                </div>
                <p class="text-xs text-gray-500 mt-1">सिक्योरिटी डिपॉजिट (वापसी योग्य): <b id="modalSecurity"></b></p>
            </div>

            <form onsubmit="handleBookingSubmit(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium mb-1">आप क्या चाहते हैं?</label>
                    <select id="bookType" class="w-full border rounded p-2 bg-white" onchange="toggleRentDates()">
                        <option value="Rent">किराए पर लेना है (On Rent)</option>
                        <option value="Buy">खरीदना है (Purchase)</option>
                    </select>
                </div>

                <div id="rentDateSection">
                    <label class="block font-medium mb-1">तारीख चुनें (किस दिन चाहिए):</label>
                    <input type="date" id="bookDate" required class="w-full border rounded p-2">
                    <p id="availStatus" class="text-xs mt-1 font-semibold"></p>
                </div>

                <div>
                    <label class="block font-medium mb-1">आपका नाम:</label>
                    <input type="text" id="custName" required placeholder="ग्राहक का नाम" class="w-full border rounded p-2">
                </div>

                <div>
                    <label class="block font-medium mb-1">मोबाइल नंबर:</label>
                    <input type="tel" id="custPhone" required placeholder="10 अंकों का मोबाइल नंबर" class="w-full border rounded p-2">
                </div>

                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-2.5 rounded-lg mt-2 shadow">
                    बुकिंग कन्फर्म करें
                </button>
            </form>
        </div>
    </div>

    <!-- ================= ADD PRODUCT MODAL (ADMIN) ================= -->
    <div id="addProductModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg text-rose-700 border-b pb-2 mb-3">नया सामान जोड़ें</h3>
            <form onsubmit="handleAddProduct(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium">सामान का नाम:</label>
                    <input type="text" id="newTitle" required placeholder="उदा. ब्राइडल रेड जरदोजी लहंगा" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block font-medium">कैटेगरी:</label>
                    <select id="newCat" class="w-full border rounded p-2">
                        <option value="लहंगा">लहंगा</option>
                        <option value="गाउन">गाउन</option>
                        <option value="चुनरी">चुनरी</option>
                        <option value="ज्वेलरी">ज्वेलरी</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium">फोटो लिंक (Image URL):</label>
                    <input type="url" id="newImg" required placeholder="https://..." class="w-full border rounded p-2">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium">किराया (₹):</label>
                        <input type="number" id="newRent" required placeholder="2500" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block font-medium">सेल रेट (₹):</label>
                        <input type="number" id="newSale" required placeholder="15000" class="w-full border rounded p-2">
                    </div>
                </div>
                <div>
                    <label class="block font-medium">सिक्योरिटी मनी (₹):</label>
                    <input type="number" id="newSec" required placeholder="3000" class="w-full border rounded p-2">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeAddProductModal()" class="w-1/2 bg-gray-200 py-2 rounded">रद्द करें</button>
                    <button type="submit" class="w-1/2 bg-rose-600 text-white font-bold py-2 rounded">सेव करें</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Sample Initial Data (If not stored yet)
        const defaultProducts = [
            {
                id: 1,
                title: "शाही राजपूती लाल लहंगा",
                category: "लहंगा",
                rentPrice: 3500,
                salePrice: 28000,
                security: 4000,
                image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600&auto=format&fit=crop&q=80",
                bookedDates: ["2026-11-10", "2026-11-11", "2026-11-12"]
            },
            {
                id: 2,
                title: "गोल्डन ब्राइडल कुंदन सेट",
                category: "ज्वेलरी",
                rentPrice: 1200,
                salePrice: 9500,
                security: 2000,
                image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600&auto=format&fit=crop&q=80",
                bookedDates: ["2026-11-15"]
            },
            {
                id: 3,
                title: "वाइन वाइन पार्टी वियर गाउन",
                category: "गाउन",
                rentPrice: 2000,
                salePrice: 14000,
                security: 2500,
                image: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&auto=format&fit=crop&q=80",
                bookedDates: []
            }
        ];

        // Load data from LocalStorage
        let products = JSON.parse(localStorage.getItem("ss_products")) || defaultProducts;
        let bookings = JSON.parse(localStorage.getItem("ss_bookings")) || [];
        let selectedProduct = null;
        let currentMode = "customer";

        // Save back
        function saveData() {
            localStorage.setItem("ss_products", JSON.stringify(products));
            localStorage.setItem("ss_bookings", JSON.stringify(bookings));
        }

        // Render Catalog
        function renderProducts(cat = "All") {
            const list = document.getElementById("productList");
            list.innerHTML = "";

            const filtered = cat === "All" ? products : products.filter(p => p.category === cat);

            filtered.forEach(p => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative">
                            <img src="${p.image}" class="w-full h-52 object-cover" alt="${p.title}">
                            <span class="absolute top-2 right-2 bg-black/60 text-white text-[11px] px-2 py-0.5 rounded">${p.category}</span>
                        </div>
                        <div class="p-3">
                            <h4 class="font-bold text-gray-800">${p.title}</h4>
                            <div class="mt-2 flex justify-between items-center text-xs">
                                <div>
                                    <span class="text-gray-400 block">किराया</span>
                                    <span class="font-bold text-rose-600 text-sm">₹${p.rentPrice}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-gray-400 block">सेल प्राइस</span>
                                    <span class="font-bold text-green-600 text-sm">₹${p.salePrice}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 pt-0">
                        <button onclick="openBookingModal(${p.id})" class="w-full bg-rose-50 text-rose-700 hover:bg-rose-600 hover:text-white font-semibold py-2 rounded-lg text-xs transition border border-rose-200">
                            तारीख देखें और बुक करें
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Filter Categories
        function filterCategory(cat) {
            document.querySelectorAll(".cat-btn").forEach(btn => {
                btn.className = "cat-btn px-4 py-1.5 rounded-full bg-white text-gray-700 border";
                if(btn.innerText === cat || (cat === "All" && btn.innerText === "सभी")) {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full bg-rose-600 text-white font-medium shadow-sm";
                }
            });
            renderProducts(cat);
        }

        // Booking Modal Logic
        function openBookingModal(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById("modalTitle").innerText = selectedProduct.title;
            document.getElementById("modalImg").src = selectedProduct.image;
            document.getElementById("modalRent").innerText = `₹${selectedProduct.rentPrice} / कार्यक्रम`;
            document.getElementById("modalSale").innerText = `₹${selectedProduct.salePrice}`;
            document.getElementById("modalSecurity").innerText = `₹${selectedProduct.security}`;
            
            // Check date change live
            const dateInput = document.getElementById("bookDate");
            dateInput.value = "";
            document.getElementById("availStatus").innerText = "";
            dateInput.onchange = checkDateAvailability;

            document.getElementById("bookingModal").classList.remove("hidden");
        }

        function checkDateAvailability() {
            const date = document.getElementById("bookDate").value;
            const statusEl = document.getElementById("availStatus");
            if (!date) return;

            if (selectedProduct.bookedDates.includes(date)) {
                statusEl.innerHTML = `<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> यह तारीख पहले से बुक है! कृपया दूसरी तारीख चुनें।</span>`;
            } else {
                statusEl.innerHTML = `<span class="text-green-600"><i class="fa-solid fa-circle-check"></i> उपलब्ध है! आप इस तारीख के लिए बुक कर सकते हैं।</span>`;
            }
        }

        function closeModal() {
            document.getElementById("bookingModal").classList.add("hidden");
        }

        function toggleRentDates() {
            const type = document.getElementById("bookType").value;
            document.getElementById("rentDateSection").style.display = type === "Rent" ? "block" : "none";
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            const type = document.getElementById("bookType").value;
            const date = document.getElementById("bookDate").value;
            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;

            if (type === "Rent" && selectedProduct.bookedDates.includes(date)) {
                alert("यह तारीख पहले से बुक है, कृपया दूसरी तारीख चुनें!");
                return;
            }

            // Record Booking in Khata
            const newBooking = {
                id: Date.now(),
                productId: selectedProduct.id,
                productTitle: selectedProduct.title,
                type: type,
                date: type === "Rent" ? date : "Permanent Sale",
                customer: name,
                phone: phone,
                rent: selectedProduct.rentPrice,
                security: selectedProduct.security,
                status: "बुकिंग कन्फर्म"
            };

            bookings.unshift(newBooking);
            if (type === "Rent" && date) {
                selectedProduct.bookedDates.push(date);
            }
            saveData();

            alert(`धन्यवाद ${name}! आपकी बुकिंग शिवशक्ति लहंगा हाउस में दर्ज हो गई है।`);
            closeModal();
            renderLedger();
        }

        // Admin & Khata View
        function toggleMode() {
            const custView = document.getElementById("customerView");
            const adminView = document.getElementById("adminView");
            const btn = document.getElementById("modeBtn");

            if (currentMode === "customer") {
                currentMode = "admin";
                custView.classList.add("hidden");
                adminView.classList.remove("hidden");
                btn.innerHTML = `<i class="fa-solid fa-shop"></i> ग्राहक व्यू`;
                renderLedger();
            } else {
                currentMode = "customer";
                adminView.classList.add("hidden");
                custView.classList.remove("hidden");
                btn.innerHTML = `<i class="fa-solid fa-book"></i> खाता / एडमिन`;
                renderProducts();
            }
        }

        function renderLedger() {
            const ledger = document.getElementById("bookingLedger");
            ledger.innerHTML = "";

            if (bookings.length === 0) {
                ledger.innerHTML = `<p class="text-xs text-gray-400">अभी कोई बुकिंग नहीं हुई है।</p>`;
                return;
            }

            bookings.forEach(b => {
                const item = document.createElement("div");
                item.className = "bg-white p-3 rounded-lg border shadow-sm text-xs space-y-1";
                item.innerHTML = `
                    <div class="flex justify-between font-bold">
                        <span class="text-rose-700">${b.productTitle}</span>
                        <span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded text-[10px]">${b.type}</span>
                    </div>
                    <div class="text-gray-600">तारीख: <b>${b.date}</b> | ग्राहक: <b>${b.customer}</b> (${b.phone})</div>
                    <div class="flex justify-between pt-1 border-t text-gray-500">
                        <span>किराया: ₹${b.rent}</span>
                        <span>सिक्योरिटी: ₹${b.security} (जमा)</span>
                    </div>
                `;
                ledger.appendChild(item);
            });
        }

        // Add Product (Admin)
        function openAddProductModal() { document.getElementById("addProductModal").classList.remove("hidden"); }
        function closeAddProductModal() { document.getElementById("addProductModal").classList.add("hidden"); }

        function handleAddProduct(e) {
            e.preventDefault();
            const product = {
                id: Date.now(),
                title: document.getElementById("newTitle").value,
                category: document.getElementById("newCat").value,
                image: document.getElementById("newImg").value,
                rentPrice: Number(document.getElementById("newRent").value),
                salePrice: Number(document.getElementById("newSale").value),
                security: Number(document.getElementById("newSec").value),
                bookedDates: []
            };

            products.unshift(product);
            saveData();
            closeAddProductModal();
            alert("नया प्रोडक्ट सफलतापूर्वक जोड़ दिया गया!");
        }

        // Initial Load
        renderProducts();
    </script>
</body>
              </html>
